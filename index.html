<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台灣行人 taiwan-ped</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: system-ui, "Noto Sans TC", sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        color: #fff;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        user-select: none;
        pointer-events: none;
      }
      #hearts {
        color: #ff5a6a;
        font-size: 28px;
        letter-spacing: 5px;
      }
      #hud .row {
        font-size: 22px;
        margin-top: 4px;
      }
      #timer.low {
        color: #ff8080;
      }
      /* 全螢幕覆蓋畫面共用樣式（橫幅／失敗／通關） */
      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #fff;
        text-align: center;
        user-select: none;
      }
      .overlay.show {
        display: flex;
      }
      .overlay h1 {
        font-size: 52px;
        margin: 0;
        text-shadow: 0 3px 6px rgba(0, 0, 0, 0.7);
      }
      .overlay p {
        font-size: 22px;
        margin: 0;
      }
      #banner {
        background: rgba(0, 0, 0, 0.4);
      }
      /* 失敗畫面：之後要換素材／改版面就改這一塊（文字由 hud.ts 的 showFail 塞入） */
      #fail {
        background: rgba(120, 0, 0, 0.45);
      }
      /* 通關畫面：細節未定，先佔位 */
      #win {
        background: rgba(0, 90, 45, 0.5);
      }
      #debug {
        position: fixed;
        top: 16px;
        right: 16px;
        display: none;
        white-space: pre;
        font: 13px/1.6 ui-monospace, monospace;
        color: #9f9;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 12px;
        border-radius: 6px;
      }
      #debug.show {
        display: block;
      }
      #hint {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.7);
        font-size: 16px;
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="hearts">❤ ❤ ❤</div>
      <div class="row" id="level"></div>
      <div class="row" id="progress"></div>
      <div class="row" id="timer"></div>
    </div>
    <div id="banner" class="overlay">
      <h1 id="banner-title"></h1>
      <p id="banner-sub"></p>
    </div>
    <div id="fail" class="overlay">
      <h1 id="fail-title"></h1>
      <p id="fail-sub"></p>
      <p id="fail-prompt"></p>
    </div>
    <div id="win" class="overlay">
      <h1>🎉 恭喜通關！</h1>
      <p>你在行人地獄活了下來</p>
      <p id="win-prompt"></p>
    </div>
    <div id="debug"></div>
    <div id="hint">↑ 前進　↓ 後退　← → 橫移</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
