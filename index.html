<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>我們的賽車場</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: system-ui, "Noto Sans TC", sans-serif;
        touch-action: none; /* 擋掉手機的下拉重整、雙擊縮放等手勢 */
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        color: #fff;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        user-select: none;
        pointer-events: none;
      }
      #hearts {
        color: #ff5a6a;
        font-size: 28px;
        letter-spacing: 5px;
      }
      #hud .row {
        font-size: 22px;
        margin-top: 4px;
      }
      /* 後方來車警示：紅色「!」在畫面下方閃，依車在左後/右後偏左/偏右並帶箭頭；快追上時閃更快 */
      #warn {
        position: fixed;
        left: 50%;
        bottom: 22%;
        transform: translateX(-50%);
        font-size: 72px;
        font-weight: 900;
        color: #ff2b2b;
        text-shadow: 0 0 12px rgba(255, 40, 40, 0.9), 0 3px 6px rgba(0, 0, 0, 0.8);
        display: none;
        pointer-events: none;
        user-select: none;
        animation: warn-blink 0.5s steps(1) infinite;
      }
      #warn.show {
        display: block;
      }
      #warn.left {
        transform: translateX(-160%);
      }
      #warn.right {
        transform: translateX(60%);
      }
      #warn.urgent {
        font-size: 96px;
        animation-duration: 0.2s;
      }
      @keyframes warn-blink {
        50% {
          opacity: 0.25;
        }
      }
      #timer.low {
        color: #ff8080;
      }
      /* 這關的目的地任務（「全聯｜特價只到今天」），整關都掛在左上角；空的不佔位 */
      #goal {
        color: #ffd97a;
        font-size: 19px;
      }
      #goal:empty {
        display: none;
      }
      /* 無盡模式升階提示：畫面中上方浮出、2 秒淡出（hud.ts showToast） */
      #toast {
        position: fixed;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        color: #ffd97a;
        font-size: 30px;
        font-weight: 700;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        user-select: none;
      }
      #toast.show {
        animation: toast-fade 2.2s ease-out forwards;
      }
      @keyframes toast-fade {
        0% { opacity: 0; transform: translate(-50%, 12px); }
        12% { opacity: 1; transform: translate(-50%, 0); }
        70% { opacity: 1; }
        100% { opacity: 0; }
      }
      /* 全螢幕覆蓋畫面共用樣式（橫幅／失敗／通關） */
      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #fff;
        text-align: center;
        user-select: none;
      }
      .overlay.show {
        display: flex;
      }
      .overlay h1 {
        font-size: 52px;
        margin: 0;
        text-shadow: 0 3px 6px rgba(0, 0, 0, 0.7);
      }
      .overlay p {
        font-size: 22px;
        margin: 0;
      }
      #banner {
        background: rgba(0, 0, 0, 0.4);
      }
      /* 開場標題畫面（素材載入中顯示；文字由 hud.ts showTitle 塞入） */
      #title {
        background: rgba(10, 12, 20, 0.62);
        gap: 10px;
        transition: background 1.2s ease-out;
      }
      /* 素材還在載：不透明底，蓋住後面的街屋佔位色塊；到齊後淡成半透明，場景浮現 */
      #title.loading {
        background: #10131a;
        transition: none;
      }
      #title h1 {
        font-size: 64px;
        letter-spacing: 6px;
        color: #ffd97a;
        margin-bottom: 14px;
      }
      #title-controls {
        font-size: 18px;
        line-height: 1.7;
        color: #c9d1dc;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 10px 26px;
        white-space: pre-line;
      }
      #title-bar {
        width: min(320px, 70vw);
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
        margin-top: 18px;
      }
      #title-bar > div {
        height: 100%;
        width: 0;
        background: #ffd97a;
        transition: width 0.3s;
      }
      #title-prompt {
        font-size: 20px;
        color: #fff;
        min-height: 1.4em;
      }
      #title-prompt.ready {
        animation: title-blink 1.1s steps(1) infinite;
      }
      @keyframes title-blink {
        50% {
          opacity: 0.25;
        }
      }
      #title-best {
        font-size: 16px;
        color: #9aa4b2;
      }
      #title-best:empty {
        display: none;
      }
      /* 從朋友的分享連結進來：標題畫面多一行挑戰 */
      #title-challenge {
        font-size: 20px;
        color: #ffd97a;
      }
      #title-challenge:empty {
        display: none;
      }
      /* 無盡模式結算的分享鈕（hud.ts setShareVisible 控制顯示） */
      #fail-share {
        margin-top: 10px;
        padding: 10px 22px;
        border: 2px solid rgba(255, 255, 255, 0.75);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #hud.hidden {
        display: none;
      }
      @media (max-width: 600px) {
        #title h1 {
          font-size: 44px;
        }
      }
      /* 素材還在載：橫幅改成不透明，後面的佔位色塊看不到 */
      #banner.loading {
        background: #1a1d22;
      }
      #banner-loading {
        font-size: 18px;
        color: #9aa4b2;
      }
      #banner-loading:empty {
        display: none;
      }
      /* 關卡的風味小語（如「趕著打卡」），沒設定就是空的不佔位 */
      #banner-flavor {
        font-size: 26px;
        color: #ffd97a;
      }
      #banner-flavor:empty {
        display: none;
      }
      /* 失敗畫面：之後要換素材／改版面就改這一塊（文字由 hud.ts 的 showFail 塞入） */
      #fail {
        background: rgba(120, 0, 0, 0.45);
      }
      /* 被撞那一刻的紅色暈影：瞬間亮起（.show）、拿掉後半秒淡出（hud.ts flashHit） */
      #hit-vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(255, 0, 0, 0) 35%, rgba(200, 0, 0, 0.85) 100%);
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }
      #hit-vignette.show {
        opacity: 1;
        transition: opacity 0.04s;
      }
      /* 死亡小知識（從 tuning.ts 的 deathCaptions 池隨機抽），空的不佔位 */
      #fail-flavor {
        font-size: 19px;
        color: #ffd9c9;
        max-width: 34em;
        padding: 0 16px;
      }
      #fail-flavor:empty {
        display: none;
      }
      /* 抵達畫面 */
      #win {
        background: rgba(0, 90, 45, 0.5);
      }
      #debug {
        position: fixed;
        top: 70px; /* 讓開右上角的音效按鈕 */
        right: 16px;
        display: none;
        white-space: pre;
        font: 13px/1.6 ui-monospace, monospace;
        color: #9f9;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 12px;
        border-radius: 6px;
      }
      #debug.show {
        display: block;
      }
      /* 音效開關（右上角）：手機沒有鍵盤按不到 M 鍵，所以要有這顆。
         z-index 壓過所有覆蓋畫面，標題/失敗/抵達畫面上也按得到；
         touch.ts 看到點的是 <button> 就不生搖桿，所以按它不會順便開始遊戲 */
      #sound {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        width: 44px; /* 手指點得到的最小尺寸 */
        height: 44px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-size: 20px;
        line-height: 44px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #sound.off {
        opacity: 0.45;
      }
      /* 虛擬搖桿（touch.ts 控制顯示位置） */
      #stick-base {
        position: fixed;
        display: none;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.12);
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 5;
      }
      #stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        transform: translate(-50%, -50%);
      }
      #hint {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.7);
        font-size: 16px;
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="hearts">❤ ❤ ❤</div>
      <div class="row" id="level"></div>
      <div class="row" id="goal"></div>
      <div class="row" id="progress"></div>
      <div class="row" id="timer"></div>
    </div>
    <div id="title" class="overlay">
      <h1 id="title-name"></h1>
      <p id="title-controls"></p>
      <div id="title-bar"><div id="title-bar-fill"></div></div>
      <p id="title-prompt"></p>
      <p id="title-best"></p>
      <p id="title-challenge"></p>
    </div>
    <div id="banner" class="overlay">
      <h1 id="banner-title"></h1>
      <p id="banner-flavor"></p>
      <p id="banner-sub"></p>
      <p id="banner-loading"></p>
    </div>
    <div id="hit-vignette"></div>
    <button id="sound" type="button" aria-label="音效開關">🔊</button>
    <div id="fail" class="overlay">
      <h1 id="fail-title"></h1>
      <p id="fail-flavor"></p>
      <p id="fail-sub"></p>
      <p id="fail-prompt"></p>
      <button id="fail-share" type="button" hidden>分享成績</button>
    </div>
    <!-- 抵達畫面（文字由 hud.ts 的 showClear 塞入） -->
    <div id="win" class="overlay">
      <h1 id="win-title"></h1>
      <p id="win-flavor"></p>
      <p id="win-prompt"></p>
    </div>
    <div id="debug"></div>
    <div id="stick-base"><div id="stick-knob"></div></div>
    <div id="warn"></div>
    <div id="toast"></div>
    <div id="hint">↑ 前進　↓ 後退　← → 橫移　或 滑鼠按住拖曳</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
